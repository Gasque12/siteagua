<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F8480" />
      <stop offset="100%" stop-color="#349B96" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#E57310" />
    </linearGradient>
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Icon Symbol: Sun + Water Drop + Leaf Harmony -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Outer Shield / Circle Base -->
    <circle cx="30" cy="30" r="28" fill="#123A46" />
    
    <!-- Sun arc (heat protection) -->
    <path d="M 16 22 A 16 16 0 0 1 44 22" fill="none" stroke="url(#sunGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Sun rays -->
    <line x1="30" y1="10" x2="30" y2="6" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="13" x2="15" y2="10" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <line x1="42" y1="13" x2="45" y2="10" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />

    <!-- Water Drop (rain solutions) -->
    <path d="M 30 23 C 30 23 20 36 20 42 C 20 47.5 24.5 52 30 52 C 35.5 52 40 47.5 40 42 C 40 36 30 23 30 23 Z" fill="url(#rainGrad)" opacity="0.95" />

    <!-- Leaf accent (sustainability/comfort) inside drop -->
    <path d="M 30 30 Q 35 37 32 45 Q 26 42 30 30 Z" fill="#B9EBE5" opacity="0.9" />
  </g>
  
  <!-- Typography -->
  <g transform="translate(82, 44)">
    <text font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#123A46" letter-spacing="-0.5">
      ECO<tspan fill="#1F8480">CLIMA</tspan>
    </text>
    <text y="18" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#5A7184" letter-spacing="2">
      VILA REZENDE • PIRACICABA
    </text>
  </g>
</svg>
